services:
  postgres:
    image: postgres:16-alpine
    container_name: studify-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studify}
      POSTGRES_DB: ${POSTGRES_DB:-studify}
    ports:
      - "${POSTGRES_HOST_PORT:-4444}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studify} -d ${POSTGRES_DB:-studify}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: studify-backend
    working_dir: /app
    command: air
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      ISSUER: ${ISSUER:-studify}
      DATABASE_URL: postgres://${POSTGRES_USER:-studify}:${POSTGRES_PASSWORD:-studify}@postgres:5432/${POSTGRES_DB:-studify}?sslmode=disable
      SERVER_ADDR: :${BACKEND_CONTAINER_PORT:-8080}
      ENV: ${ENV:-dev}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-5173},http://localhost:${SWAGGER_HOST_PORT:-8081},http://localhost:3000
    ports:
      - "${BACKEND_HOST_PORT:-8080}:${BACKEND_CONTAINER_PORT:-8080}"
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.30.2
    container_name: studify-swagger
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      WITH_CREDENTIALS: "true"
      DISPLAY_REQUEST_DURATION: "true"
    ports:
      - "${SWAGGER_HOST_PORT:-8081}:8080"
    volumes:
      - ./backend/docs/openapi.yaml:/spec/openapi.yaml:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: studify-frontend
    working_dir: /app
    command: >
      sh -c "bun install --frozen-lockfile &&
      bun run dev -- --host 0.0.0.0 --port ${FRONTEND_CONTAINER_PORT:-5173}"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:${FRONTEND_CONTAINER_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_tmp:
  frontend_node_modules:
