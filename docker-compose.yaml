services:
  postgres:
    image: postgres:16-alpine
    container_name: studify-postgres
    environment:
      POSTGRES_USER: studify
      POSTGRES_PASSWORD: studify
      POSTGRES_DB: studify
    ports:
      - "4444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studify -d studify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: studify-backend
    working_dir: /app
    command: air
    environment:
      DATABASE_URL: postgres://studify:studify@postgres:5432/studify?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: studify-frontend
    working_dir: /app
    command: bun run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_tmp:
  frontend_node_modules:
