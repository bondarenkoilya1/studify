volumes:
  postgres_data:
  backend_tmp:
  mailpit_data:
  frontend_node_modules:
  prometheus_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studify}
      POSTGRES_DB: ${POSTGRES_DB:-studify}
    ports:
      - "${POSTGRES_HOST_PORT:-4444}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studify} -d ${POSTGRES_DB:-studify}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: air
    environment:
      # Security
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      ISSUER: ${ISSUER:-studify}

      # Application
      APP_NAME: ${APP_NAME:-Studify}
      APP_URL: ${APP_URL:-http://localhost:5173}
      ENV: ${ENV:-dev}
      SERVER_ADDR: :${BACKEND_CONTAINER_PORT:-8080}

      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-studify}:${POSTGRES_PASSWORD:-studify}@postgres:5432/${POSTGRES_DB:-studify}?sslmode=disable

      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-5173},http://localhost:${SWAGGER_HOST_PORT:-8081},http://localhost:3000

      # Mail
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM: ${MAIL_FROM:-noreply@studify.dev}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:${BACKEND_CONTAINER_PORT:-8080}"
    volumes:
      - ./backend:/app
      - backend_tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  swagger:
    image: swaggerapi/swagger-ui:v5.30.2
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      WITH_CREDENTIALS: "true"
      DISPLAY_REQUEST_DURATION: "true"
    ports:
      - "${SWAGGER_HOST_PORT:-8081}:8080"
    volumes:
      - ./backend/docs/openapi.yaml:/spec/openapi.yaml:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      sh -c "bun install --frozen-lockfile &&
      bun run dev -- --host 0.0.0.0 --port ${FRONTEND_CONTAINER_PORT:-5173}"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:${FRONTEND_CONTAINER_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"