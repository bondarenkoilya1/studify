        '204':
          description: Shared project was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me:
    get:
      tags: [Profile]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/email:
    patch:
      tags: [Profile]
      summary: Update the authenticated user's email
      description: |
        Requires the current password and an already verified email. Sets `is_email_verified`
        to false, invalidates older links, and queues a new confirmation email. The new email must
        be a valid address and differ from the current one. An email that is already taken returns 409 Conflict.
        The response has `is_totp_enabled: false` and `avatar_url: null` regardless of the
        stored values; call GET /api/users/me for the full profile.
      operationId: updateUserEmail
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Email updated. A new confirmation email can also be requested with the resend endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/password:
    patch:
      tags: [Profile]
      summary: Update the authenticated user's password
      description: |
        The new password must be at least 8 characters and at most 72 UTF-8 bytes.
        It must differ from the current password.
        A wrong current password returns 403 Forbidden.
      operationId: updateUserPassword
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '204':
          description: Password updated, all sessions revoked, and auth cookies cleared.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/avatar:
    post:
      tags: [Profile]
      summary: Upload the current user's avatar as raw image bytes
      description: |
        The request body is the raw image (not multipart). PNG, JPEG, and WebP are accepted, up to
        2 MB and 2560x2560 px. The image is converted to WebP and stored under `/static/users/`.
      operationId: uploadUserAvatar
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Avatar saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResponse'
        '400':
          description: Undecodable image or dimensions above 2560x2560.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ImageTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedImage'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Profile]
      summary: Remove the current user's avatar
      description: Sets `avatar_url` to null. The stored image file is not deleted.
      operationId: deleteUserAvatar
      security:
        - accessCookie: []
      responses:
        '204':
          description: Avatar removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /static/{path}:
    get:
      tags: [Static]
      summary: Download an uploaded file
      description: |
        Serves files from the backend `data/` directory, for example
        `/static/users/{file}.webp`, `/static/thumbnails/{file}.webp`, and `/static/files/{file}.pdf`.
        Requires authentication. Attachments and thumbnails are accessible only to the
        owner of the subject. Avatar URLs are available to signed-in users, including the shared catalog.
        The API serves individual files and does not list directories.
      operationId: getStaticFile
      security:
        - accessCookie: []
      parameters:
        - name: path
          in: path
          required: true
          description: Path relative to `/static/`, for example `users/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp`.
          schema:
            type: string
      responses:
        '200':
          description: File contents.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /metrics:
    get:
      tags: [Monitoring]
      summary: Prometheus metrics
      description: Prometheus text exposition on the metrics listener (separate from the production API).
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Metrics.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT access token cookie.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly JWT refresh token cookie.

  parameters:
    NumericId:
      name: id
      in: path
      required: true
      description: Positive database identifier.
      schema:
        type: integer
        format: int64
        minimum: 1

  headers:
    AuthCookies:
      description: Session cookies are set by the backend.
      schema:
        type: string

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'

  responses:
    EmailAlreadyVerified:
      description: The current email address is already verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Request quota exceeded.
      headers:
        Retry-After:
          description: Suggested wait time in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The JSON request body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid JSON, missing fields, or invalid payload values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication cookies.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Action forbidden (e.g. invalid current password).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A user with this email already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type must be application/json for JSON endpoints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The submitted token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SubjectConflict:
      description: The user already has a subject with this name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SharedProjectConflict:
      description: A shared project with this URL already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ImageTooLarge:
      description: Image is larger than 2 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedImage:
      description: Image format is not PNG, JPEG, or WebP.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LecturerPosition:
      type: string
      description: Required by the backend on create; an empty or unknown value returns 400.
      enum: [lecturer, practical_instructor, lab_instructor, assistant]

    SubjectType:
      type: string
      enum: [university, personal]

    SubjectScope:
      type: string
      enum: [technology, healthcare, humanities, business, social, science, other]

    ExamType:
      type: string
      enum: [exam, credit, coursework, project, other]

    TaskType:
      type: string
      enum: [exam, credit, coursework, project, other]

    TaskStatus:
      type: string
      enum: [not_completed, ongoing, completed]

    TaskDifficulty:
      type: string
      enum: [low, medium, high]

    TaskPriority:
      type: string
      enum: [low, medium, high]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable application error code.
          example: invalid_credentials
        message:
          type: string
          description: Human-readable explanation.
          example: invalid email or password

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Must be a plain address such as `student@example.com` (no display name).
          example: student@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 8-72 characters on register. Login only checks that it is non-empty and at most 72 characters.
          writeOnly: true
          example: strongPassword123

    User:
      type: object
      required: [id, email, is_email_verified, is_totp_enabled, avatar_url]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: student@example.com
        is_email_verified:
          type: boolean
          example: true
        is_totp_enabled:
          type: boolean
          example: false
        avatar_url:
          type: string
          nullable: true
          example: /static/users/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp

    ChallengeTokenResponse:
      type: object
      required: [challenge_token]
      properties:
        challenge_token:
          type: string
          description: One-time login challenge token for /api/auth/login/totp, valid for 2 minutes.
          example: Xk3pN8vQ2mR7tY1wZ5cB9dF4gH6jL0sA2eU8iO3qT7y

    LoginTOTPRequest:
      type: object
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
          example: Xk3pN8vQ2mR7tY1wZ5cB9dF4gH6jL0sA2eU8iO3qT7y
        code:
          type: string
          description: Six-digit authenticator code or a one-time recovery code, such as ABCD-EFGH-JK23.
          example: '123456'

    Passcode:
      type: object
      required: [passcode]
      properties:
        passcode:
          type: string
          description: 6-digit TOTP validation code.
          example: '123456'

    TOTPSetupResponse:
      type: object
      required: [qr_code, text_key]
      properties:
        qr_code:
          type: string
          description: Base64-encoded PNG of the QR code (without a `data:` prefix).
          example: iVBORw0KGgoAAAANSUhEUgAA...
        text_key:
          type: string
          description: TOTP secret to enter manually in the authenticator app.
          example: JBSWY3DPEHPK3PXP

    RecoveryCodesResponse:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$'
          example:
            - ABCD-EFGH-JK23
            - MNPQ-RSTU-VW45
            - XYZ2-3456-789A
            - BCDE-FGHJ-KLMN
            - PQRS-TUVW-XYZ2
            - 3456-789A-BCDE
            - FGHJ-KLMN-PQRS
            - TUVW-XYZ2-3456
            - 789A-BCDE-FGHJ
            - KLMN-PQRS-TUVW

    EmailRequest:
      type: object
      required: [new_email, current_password]
      properties:
        new_email:
          type: string
          format: email
          example: new_student@example.com
        current_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1

    CurrentPasswordRequest:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1

    PasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          example: currentStrongPassword123
        new_password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          example: newStrongPassword123

    PasswordResetEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: student@example.com

    PasswordResetTokenRequest:
      type: object
      required: [password_reset_token]
      properties:
        password_reset_token:
          type: string
          example: q8Zr3k1V0p9xWm2Lc7NfYt4Hb6Ds5Ja0Ue8Gi1Ko3Rw

    PasswordResetRequest:
      type: object
      required: [password_reset_token, new_password, new_password_confirmed]
      properties:
        password_reset_token:
          type: string
          example: q8Zr3k1V0p9xWm2Lc7NfYt4Hb6Ds5Ja0Ue8Gi1Ko3Rw
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          example: StrongResetPassword123
        new_password_confirmed:
          type: string
          format: password
          writeOnly: true
          example: StrongResetPassword123

    Lecturer:
      type: object
      required: [name, position]
      properties:
        name:
          type: string
          example: Dr. Smith
        position:
          $ref: '#/components/schemas/LecturerPosition'

    Subject:
      type: object
      required: [id, user_id, name, note, type, scope, exam_type, exam_date, course, term, lecturers, thumbnail_url, files]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Databases
        note:
          type: string
          nullable: true
          maxLength: 200
          example: Intro to SQL and relation modeling
        type:
          $ref: '#/components/schemas/SubjectType'
        scope:
          $ref: '#/components/schemas/SubjectScope'
        exam_type:
          $ref: '#/components/schemas/ExamType'
        exam_date:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-20T09:00:00Z'
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          example: 2
        term:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
        thumbnail_url:
          type: string
          nullable: true
          example: /static/thumbnails/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp
        lecturers:
          type: array
          nullable: true
          description: '`null` when the subject has no lecturers.'
          items:
            $ref: '#/components/schemas/Lecturer'
        files:
          type: array
          nullable: true
          description: '`null` when there are no files, and always `null` in list and create responses.'
          items:
            $ref: '#/components/schemas/SubjectFile'

    SubjectFile:
      type: object
      required: [name, url, size_bytes, content_type]
      properties:
        name:
          type: string
          description: Original file name.
          example: lecture-1.pdf
        url:
          type: string
          example: /static/files/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.pdf
        size_bytes:
          type: string
          description: File size in bytes, encoded as a string.
          example: '182734'
        content_type:
          type: string
          example: application/pdf

    SubjectCreateRequest:
      type: object
      required: [name]
      description: Empty `type`, `scope`, and `exam_type` default to `university`, `other`, and `exam`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Databases
        note:
          type: string
          nullable: true
          maxLength: 200
          example: Intro to SQL and relation modeling
        type:
          $ref: '#/components/schemas/SubjectType'
        scope:
          $ref: '#/components/schemas/SubjectScope'
        exam_type:
          $ref: '#/components/schemas/ExamType'
        exam_date:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-20T09:00:00Z'
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          example: 2
        term:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
        thumbnail_url:
          type: string
          nullable: true
          example: /static/thumbnails/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp
        lecturers:
          type: array
          description: Only used on create. Ignored by PUT.
          items:
            $ref: '#/components/schemas/Lecturer'

    SubjectUpdateRequest:
      type: object
      minProperties: 1
      description: Send only the fields to change. Pass null for note, course, term, or exam_date to clear the field.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Advanced Databases
        note:
          type: string
          nullable: true
          maxLength: 200
          example: Intro to SQL and relation modeling
        type:
          $ref: '#/components/schemas/SubjectType'
        scope:
          $ref: '#/components/schemas/SubjectScope'
        exam_type:
          $ref: '#/components/schemas/ExamType'
        exam_date:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-20T09:00:00Z'
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          example: 2
        term:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
        lecturers:
          type: array
          nullable: true
          description: Replaces the complete list. An empty array or null clears it.
          items:
            $ref: '#/components/schemas/Lecturer'
        thumbnail_url:
          type: string
          nullable: true
          example: /static/thumbnails/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp

    Task:
      type: object
      required: [id, subject_id, name, type, description, estimated_time, scheduled_at, deadline, status, difficulty, priority, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 10
        subject_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Read chapter 4
        type:
          $ref: '#/components/schemas/TaskType'
        description:
          type: string
          example: Write a short summary and review the key terms.
        estimated_time:
          type: integer
          nullable: true
          minimum: 1
          example: 90
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-08T12:00:00Z'
        deadline:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-10T12:00:00Z'
        scheduled_date:
          type: string
          format: date
          nullable: true
          description: All-day schedule date, independent of timezone. Takes precedence over scheduled_at.
          example: '2026-07-08'
        deadline_date:
          type: string
          format: date
          nullable: true
          description: All-day deadline date. Takes precedence over deadline for calendar and dashboard calculations.
          example: '2026-07-10'
        status:
          $ref: '#/components/schemas/TaskStatus'
        difficulty:
          $ref: '#/components/schemas/TaskDifficulty'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        created_at:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-02T09:00:00Z'

    TaskCreateRequest:
      type: object
      required: [subject_id, name, type, status, difficulty, priority]
      properties:
        subject_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Read chapter 4
        type:
          $ref: '#/components/schemas/TaskType'
        description:
          type: string
          maxLength: 2000
          example: Write a short summary and review the key terms.
        estimated_time:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
          example: 90
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-08T12:00:00Z'
        deadline:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-10T12:00:00Z'
        scheduled_date:
          type: string
          format: date
          nullable: true
          description: All-day schedule date, independent of timezone. Takes precedence over scheduled_at.
          example: '2026-07-08'
        deadline_date:
          type: string
          format: date
          nullable: true
          description: All-day deadline date. Takes precedence over deadline for calendar and dashboard calculations.
          example: '2026-07-10'
        status:
          $ref: '#/components/schemas/TaskStatus'
        difficulty:
          $ref: '#/components/schemas/TaskDifficulty'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    TaskUpdateRequest:
      type: object
      minProperties: 1
      description: Send only the fields to change. Null clears the estimate, schedule, or deadline. Sending only one member of a date and timestamp pair replaces the pair.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Read chapters 4 and 5
        type:
          $ref: '#/components/schemas/TaskType'
        description:
          type: string
          maxLength: 2000
          example: Review the primary definitions and examples.
        estimated_time:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
          example: 120
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-08T12:00:00Z'
        deadline:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-11T12:00:00Z'
        scheduled_date:
          type: string
          format: date
          nullable: true
          description: All-day schedule date, independent of timezone. Takes precedence over scheduled_at.
          example: '2026-07-08'
        deadline_date:
          type: string
          format: date
          nullable: true
          description: All-day deadline date. Takes precedence over deadline for calendar and dashboard calculations.
          example: '2026-07-10'
        subject_id:
          type: integer
          format: int64
          minimum: 1
          example: 2
        status:
          $ref: '#/components/schemas/TaskStatus'
        difficulty:
          $ref: '#/components/schemas/TaskDifficulty'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    ReminderTarget:
      type: string
      enum: [task, subject]

    ReminderTiming:
      type: object
      required: [lead_minutes, time_zone]
      properties:
        lead_minutes: { type: integer, minimum: 5, maximum: 10080 }
        time_zone: { type: string, example: Europe/Moscow }

    ReminderState:
      type: object
      required: [verified, event_at, lead_minutes, send_at, outcome, time_zone]
      properties:
        verified: { type: boolean }
        event_at: { type: string, format: date-time, nullable: true }
        lead_minutes: { type: integer, nullable: true }
        send_at: { type: string, format: date-time, nullable: true }
        outcome: { type: string, enum: [accepted, exhausted], nullable: true }
        time_zone: { type: string }

    CalendarData:
      type: object
      required: [subjects, tasks]
      properties:
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/CalendarSubject'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/StudyPlanTask'

    CalendarSubject:
      type: object
      required: [id, name, scope, exam_type, exam_date]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        scope:
          $ref: '#/components/schemas/SubjectScope'
        exam_type:
          $ref: '#/components/schemas/ExamType'
        exam_date: { type: string, format: date-time, nullable: true }

    StudyPlanTask:
      type: object
      required: [id, subject_id, name, status, estimated_time, scheduled_at, deadline]
      properties:
        id: { type: integer, format: int64 }
        subject_id: { type: integer, format: int64 }
        name: { type: string }
        status:
          $ref: '#/components/schemas/TaskStatus'
        estimated_time: { type: integer, nullable: true }
        scheduled_date: { type: string, format: date, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        deadline_date: { type: string, format: date, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }

    StudyPlan:
      type: object
      required: [subjects, tasks, overdue_tasks, overdue_total, total_tasks, total_completed_tasks, total_ongoing_tasks, as_of]
      properties:
        subjects:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        tasks:
          type: array
          description: Open tasks without a passed deadline.
          items:
            $ref: '#/components/schemas/StudyPlanTask'
        overdue_tasks:
          type: array
          description: Page of open tasks with a passed deadline, oldest deadline first.
          items:
            $ref: '#/components/schemas/StudyPlanTask'
        overdue_total: { type: integer, format: int64 }
        total_tasks: { type: integer, format: int64 }
        total_completed_tasks: { type: integer, format: int64 }
        total_ongoing_tasks: { type: integer, format: int64 }
        as_of: { type: string, format: date-time }

    DashboardStatus:
      type: object
      required:
        - total_subjects
        - total_tasks
        - total_completed_tasks
        - total_ongoing_tasks
        - total_not_completed_tasks
        - completion_percent
        - nearest_deadline_task
        - overdue_total
        - overdue_tasks
      properties:
        total_subjects:
          type: integer
          format: int64
          example: 2
        total_tasks:
          type: integer
          format: int64
          example: 8
        total_completed_tasks:
          type: integer
          format: int64
          example: 3
        total_ongoing_tasks:
          type: integer
          format: int64
          example: 2
        total_not_completed_tasks:
          type: integer
          format: int64
          example: 3
        completion_percent:
          type: number
          format: double
          example: 37.5
        nearest_deadline_task:
          description: Unfinished task with the closest future deadline, or `null`.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DashboardTask'
        overdue_total: { type: integer, format: int64 }
        overdue_tasks:
          type: array
          description: One page of unfinished tasks whose deadline has passed, latest deadline first.
          items:
            $ref: '#/components/schemas/DashboardTask'

    DashboardTask:
      type: object
      description: |
        Task with id, name, description, deadline, deadline_date, status, and subject_id filled. The other
        Task fields are present with zero values (empty strings, null, `0001-01-01T00:00:00Z`).
      allOf:
        - $ref: '#/components/schemas/Task'

    AvatarUploadResponse:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: string
          example: /static/users/26c15f91-1756-4be7-b4b5-4ea6732dbe11.webp

    ThumbnailUploadResponse:
      type: object
      required: [thumbnail_url]
      properties:
        thumbnail_url:
          type: string
          example: /static/thumbnails/26c15f91-1756-4be7-b4b5-4ea6732dbe11.webp

    FileUploadResponse:
      type: object
      required: [file_url]
      properties:
        file_url:
          type: string
          example: /static/files/26c15f91-1756-4be7-b4b5-4ea6732dbe11.pdf

    ConfirmEmailRequest:
      type: object
      required: [ confirm_email_token ]
      properties:
        confirm_email_token:
          type: string
          description: Token from the confirmation link sent by email.
          example: Xk3pN8vQ2mR7tY1wZ5cB9dF4gH6jL0sA2eU8iO3qT7y

    SharedProject:
      type: object
      required:
        - id
        - user_id
        - name
        - url
        - author
        - author_avatar_url
        - is_public
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        user_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          example: Distributed Systems Notes
        url:
          type: string
          format: uri
          example: https://github.com/studify-community/distributed-systems
        author:
          type: string
          example: Alex River
        is_public:
          type: boolean
          description: Whether the owner has published the project in the catalog.
        author_avatar_url:
          type: string
          example: https://avatars.githubusercontent.com/u/1234567

    SharedProjectRequest:
      type: object
      required:
        - name
        - url
        - author
      properties:
        name:
          type: string
          minLength: 1
          example: Distributed Systems Notes
        url:
          type: string
          format: uri
          example: https://github.com/studify-community/distributed-systems
        author:
          type: string
          minLength: 1
          example: Alex River
        is_public:
          type: boolean
          description: Defaults to false on create and preserves visibility if omitted on update.
        author_avatar_url:
          type: string
          example: https://avatars.githubusercontent.com/u/1234567

    SharedProjectCatalogPage:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SharedProject'
        next_before:
          type: integer
          format: int64
          nullable: true

    AuthSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/User'

    Session:
      type: object
      required:
        - id
        - user_id
        - os
        - browser
        - device
        - country
        - last_login
        - is_current
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        user_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        os:
          type: string
          example: macOS
        browser:
          type: string
          example: Chrome
        device:
          type: string
          example: Computer
        country:
          type: string
          example: 127.0.0.1
        last_login:
          type: string
          format: date-time
          example: '2026-11-02T19:50:00Z'
        is_current:
          type: boolean
          description: Whether this is the session used to make the request.
          example: true
