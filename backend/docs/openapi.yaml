openapi: 3.0.3
info:
  title: Studify API
  version: 1.0.0
  description: |
    REST API for users, subjects, study tasks, dashboard statistics, and auth flows.

    Authentication uses HttpOnly cookies:
    - access_token
    - refresh_token

    Protected endpoints require a valid access_token cookie.
    Refresh token rotation is done through the /api/auth/refresh endpoint.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Registration, login, logout, and token issuance
  - name: Auth / Confirm
    description: Email confirmation flows
  - name: Auth / TOTP
    description: MFA setup and verification
  - name: Auth / Reset Password
    description: Password reset requests, validation, and completion
  - name: Dashboard
    description: Dashboard overview and task statistics
  - name: Subjects
    description: Subject and lecturer management
  - name: Tasks
    description: Study task management
  - name: Profile
    description: Current authenticated user account operations

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          description: User was created and auth cookies were issued.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in a user
      operationId: loginUser
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: Login was successful. If MFA is enabled, the server returns a challenge token. Otherwise it issues auth cookies and returns the user profile.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/ChallengeTokenResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login/totp:
    post:
      tags: [Auth / TOTP]
      summary: Complete MFA login with a TOTP code
      operationId: loginTOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTOTPRequest'
      responses:
        '200':
          description: TOTP challenge was accepted and the server issued auth cookies.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out the current user
      operationId: logoutUser
      responses:
        '204':
          description: Refresh token was revoked and auth cookies were cleared.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue new auth cookies
      operationId: refreshTokens
      responses:
        '204':
          description: Tokens were rotated successfully and the new auth cookies were set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/confirm/resend:
    post:
      tags: [Auth / Confirm]
      summary: Resend the email confirmation message
      operationId: resendConfirmationEmail
      security:
        - accessCookie: []
      responses:
        '204':
          description: Confirmation email was sent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/confirm/{token}:
    post:
      tags: [Auth / Confirm]
      summary: Confirm a user's email address
      operationId: confirmEmail
      security:
        - accessCookie: []
      parameters:
        - name: token
          in: path
          required: true
          description: Email confirmation token from the confirmation link.
          schema:
            type: string
      responses:
        '204':
          description: Email was confirmed successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp/setup:
    post:
      tags: [Auth / TOTP]
      summary: Generate a TOTP setup QR-code and secret
      operationId: generateTOTP
      security:
        - accessCookie: []
      responses:
        '200':
          description: TOTP secret and QR-code were generated and saved for the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp/setup/confirm:
    post:
      tags: [Auth / TOTP]
      summary: Confirm the TOTP setup with a one-time 6-digit code
      operationId: confirmTOTPSetup
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Passcode'
      responses:
        '200':
          description: TOTP setup was confirmed and recovery codes were returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp:
    delete:
      tags: [Auth / TOTP]
      summary: Disable TOTP for the authenticated user
      operationId: disableTOTP
      security:
        - accessCookie: []
      responses:
        '204':
          description: TOTP was disabled successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password/request:
    post:
      tags: [Auth / Reset Password]
      summary: Request a password reset email
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetEmailRequest'
      responses:
        '204':
          description: Password reset email was sent if the account exists.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password/verify:
    post:
      tags: [Auth / Reset Password]
      summary: Validate a password reset token
      operationId: verifyResetPasswordToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenRequest'
      responses:
        '200':
          description: Token is valid.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password:
    post:
      tags: [Auth / Reset Password]
      summary: Reset the user's password with a valid reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password was updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics for the authenticated user
      operationId: getDashboardStatus
      security:
        - accessCookie: []
      responses:
        '200':
          description: Dashboard statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects:
    get:
      tags: [Subjects]
      summary: Get all subjects of the authenticated user
      operationId: getUserSubjects
      security:
        - accessCookie: []
      responses:
        '200':
          description: Subject list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Subjects]
      summary: Create one or more subjects
      operationId: addSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
      responses:
        '201':
          description: Subject created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Subjects]
      summary: Delete all subjects of the authenticated user
      operationId: deleteUserSubjects
      security:
        - accessCookie: []
      responses:
        '204':
          description: All subjects were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Subjects]
      summary: Get a subject by ID
      operationId: getSubject
      security:
        - accessCookie: []
      responses:
        '200':
          description: Subject found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Subjects]
      summary: Replace a subject by ID
      operationId: replaceSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
      responses:
        '200':
          description: Subject replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Subjects]
      summary: Update selected fields of a subject
      operationId: updateSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectUpdateRequest'
      responses:
        '200':
          description: Subject updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Subjects]
      summary: Delete a subject by ID
      operationId: deleteSubject
      security:
        - accessCookie: []
      responses:
        '204':
          description: Subject was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}/tasks:
    get:
      tags: [Subjects]
      summary: Get tasks tied to a subject
      operationId: getSubjectTasks
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200':
          description: Tasks for the subject.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/avatar/:
    post:
      tags: [Subjects]
      summary: Upload a lecturer avatar as raw image bytes
      operationId: uploadLecturerAvatar
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Avatar saved and URL returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Image exceeds the maximum size or resolution.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported image format.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks of the authenticated user
      operationId: getUserTasks
      security:
        - accessCookie: []
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tasks]
      summary: Create a task
      operationId: addTask
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasks]
      summary: Delete all tasks of the authenticated user
      operationId: deleteUserTasks
      security:
        - accessCookie: []
      responses:
        '204':
          description: All tasks were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Tasks]
      summary: Get a task by ID
      operationId: getTask
      security:
        - accessCookie: []
      responses:
        '200':
          description: Task found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Tasks]
      summary: Replace a task by ID
      operationId: replaceTask
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '200':
          description: Task replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Tasks]
      summary: Update selected task fields
      operationId: updateTask
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasks]
      summary: Delete a task by ID
      operationId: deleteTask
      security:
        - accessCookie: []
      responses:
        '204':
          description: Task was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me:
    get:
      tags: [Profile]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/email:
    patch:
      tags: [Profile]
      summary: Update the authenticated user's email
      operationId: updateUserEmail
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Email updated and a confirmation email was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/password:
    patch:
      tags: [Profile]
      summary: Update the authenticated user's password
      operationId: updateUserPassword
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '204':
          description: Password updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT access token cookie.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly JWT refresh token cookie.

  parameters:
    NumericId:
      name: id
      in: path
      required: true
      description: Positive database identifier.
      schema:
        type: integer
        format: int64
        minimum: 1

  headers:
    AuthCookies:
      description: Session cookies are set by the backend.
      schema:
        type: string

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'

  responses:
    BadRequest:
      description: Invalid JSON, missing fields, or invalid payload values.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication cookies.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: User already exists.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type must be application/json for JSON endpoints.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The submitted token is invalid or expired.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: string
      description: Plain-text error message.
      example: invalid email or password

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 255
          example: student@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          example: strongPassword123

    User:
      type: object
      required: [id, email, is_email_verified, is_totp_enabled]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: student@example.com
        is_email_verified:
          type: boolean
          example: true
        is_totp_enabled:
          type: boolean
          example: false

    ChallengeTokenResponse:
      type: object
      required: [challenge_token]
      properties:
        challenge_token:
          type: string
          description: One-time login challenge token used with /api/auth/login/totp.
          example: e9ab... 

    LoginTOTPRequest:
      type: object
      additionalProperties: false
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
          example: e9ab7d4c9b874c4d
        code:
          type: string
          description: 6-digit TOTP code.
          example: '123456'

    Passcode:
      type: object
      additionalProperties: false
      required: [passcode]
      properties:
        passcode:
          type: string
          description: 6-digit TOTP validation code.
          example: '123456'

