  /api/shared-projects:
    get:
      tags: [Shared Projects]
      summary: List shared projects of the authenticated user
      description: Returns all shared projects owned by the authenticated user, newest first.
      operationId: getUserSharedProjects
      security:
        - accessCookie: []
      responses:
        '200':
          description: List of shared projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SharedProject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Shared Projects]
      summary: Create a shared project
      description: |
        Creates a shared project for the authenticated user.
        `name`, `url`, and `author` are required. `url` must start with http or https, and must be unique.
      operationId: createSharedProject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedProjectRequest'
