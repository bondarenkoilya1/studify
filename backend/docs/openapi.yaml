openapi: 3.0.3
info:
  title: Studify API
  version: 1.0.0
  description: |
    REST API for users, subjects, study tasks, dashboard statistics, and auth flows.

    Authentication uses HttpOnly cookies (`Path=/`, `SameSite=Lax`, `Secure` when `ENV` is
    `prod` or `production`):
    - access_token: JWT, valid for 15 minutes
    - refresh_token: JWT, valid for 30 days

    Protected endpoints require a valid access_token cookie. Refresh token rotation is done
    through the /api/auth/refresh endpoint.

    Endpoints with a JSON body require `Content-Type: application/json`, otherwise they return
    415. Errors are returned as plain text.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Registration, login, logout, and token issuance
  - name: Auth / Confirm
    description: Email confirmation flows
  - name: Auth / TOTP
    description: MFA setup and verification
  - name: Auth / Reset Password
    description: Password reset requests, validation, and completion
  - name: Dashboard
    description: Dashboard overview and task statistics
  - name: Subjects
    description: Subject and lecturer management
  - name: Tasks
    description: Study task management
  - name: Profile
    description: Current authenticated user account operations
  - name: Static
    description: Uploaded files served by the backend
  - name: Monitoring
    description: Prometheus metrics

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates the user, issues auth cookies, and sends an email confirmation link
        (`{APP_URL}/confirm/`). The confirmation token is valid for 4 hours.
      operationId: registerUser
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          description: User was created and auth cookies were issued.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in a user
      operationId: loginUser
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: |
            Credentials are valid. If TOTP is disabled, the server issues auth cookies and
            returns the user. If TOTP is enabled, no cookies are set and the server returns a
            challenge token (valid for 2 minutes) for /api/auth/login/totp.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/ChallengeTokenResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login/totp:
    post:
      tags: [Auth / TOTP]
      summary: Complete MFA login with a TOTP code
      operationId: loginTOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTOTPRequest'
      responses:
        '200':
          description: TOTP challenge was accepted and the server issued auth cookies.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out the current user
      description: Does not require an access token. Revokes the refresh token from the cookie when present.
      operationId: logoutUser
      security:
        - {}
        - refreshCookie: []
      responses:
        '204':
          description: Refresh token was revoked (if present) and auth cookies were cleared.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out from all sessions
      description: Revokes all active refresh tokens for the authenticated user and clears auth cookies.
      operationId: logoutAllSessions
      security:
        - accessCookie: []
      responses:
        '204':
          description: All active sessions were revoked and auth cookies were cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue new auth cookies
      operationId: refreshTokens
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Tokens were rotated successfully and the new auth cookies were set. On 401 both cookies are cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/confirm/resend:
    post:
      tags: [Auth / Confirm]
      summary: Resend the email confirmation message
      operationId: resendConfirmationEmail
      security:
        - accessCookie: []
      responses:
        '204':
          description: Confirmation email was sent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/confirm/:
    post:
      tags: [Auth / Confirm]
      summary: Confirm a user's email address
      description: |
        Takes the confirmation token from the email link (valid for 4 hours) in the JSON body.
        The user to verify is taken from the token record, not from the access cookie, so the
        cookie only has to be valid. The token is deleted after a successful confirmation.
        This route has no `Content-Type` check: a body that is not valid JSON returns 400, not 415.
      operationId: confirmEmail
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        '204':
          description: Email was confirmed successfully.
        '400':
          description: Invalid JSON, or the confirmation token is invalid, expired or empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp/setup:
    post:
      tags: [Auth / TOTP]
      summary: Generate a TOTP setup QR-code and secret
      description: |
        Generates a new secret and stores it encrypted. TOTP is not enabled until the setup is
        confirmed with /api/auth/totp/setup/confirm. Calling this again replaces the stored secret.
      operationId: generateTOTP
      security:
        - accessCookie: []
      responses:
        '200':
          description: TOTP secret and QR-code were generated and saved for the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp/setup/confirm:
    post:
      tags: [Auth / TOTP]
      summary: Confirm the TOTP setup with a one-time 6-digit code
      operationId: confirmTOTPSetup
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Passcode'
      responses:
        '200':
          description: |
            TOTP was enabled and 10 recovery codes were returned. The codes are shown only once.
            The current API has no endpoint that accepts a recovery code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp:
    delete:
      tags: [Auth / TOTP]
      summary: Disable TOTP for the authenticated user
      operationId: disableTOTP
      security:
        - accessCookie: []
      responses:
        '204':
          description: TOTP was disabled successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password/request:
    post:
      tags: [Auth / Reset Password]
      summary: Request a password reset email
      description: |
        Sends a link `{APP_URL}/reset-password?token={token}`. The token is valid for 30 minutes.
        If the email is not found, the endpoint returns 204 No Content to avoid user enumeration.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetEmailRequest'
      responses:
        '204':
          description: Password reset email was sent (or email does not exist, returning 204 to prevent enumeration).
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password/verify:
    post:
      tags: [Auth / Reset Password]
      summary: Validate a password reset token
      operationId: verifyResetPasswordToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenRequest'
      responses:
        '200':
          description: Token is valid. The body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password/:
    post:
      tags: [Auth / Reset Password]
      summary: Reset the user's password with a valid reset token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password was updated and the reset token was deleted.
        '400':
          description: Missing token, passwords do not match, or invalid new password.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics for the authenticated user
      operationId: getDashboardStatus
      security:
        - accessCookie: []
      responses:
        '200':
          description: Dashboard statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects:
    get:
      tags: [Subjects]
      summary: Get all subjects of the authenticated user
      description: Ordered by ID. In the list response `files` is always `null`; get one subject to see its files.
      operationId: getUserSubjects
      security:
        - accessCookie: []
      responses:
        '200':
          description: Subject list (empty array when the user has none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Subjects]
      summary: Create a subject
      description: Creates one subject together with its lecturers. Subject names are unique per user.
      operationId: addSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
      responses:
        '201':
          description: Subject created. `files` is `null` in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SubjectConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Subjects]
      summary: Delete all subjects of the authenticated user
      operationId: deleteUserSubjects
      security:
        - accessCookie: []
      responses:
        '204':
          description: All subjects were deleted, together with their tasks, lecturers, and file records.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Subjects]
      summary: Get a subject by ID
      operationId: getSubject
      security:
        - accessCookie: []
      responses:
        '200':
          description: Subject found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Subjects]
      summary: Replace a subject by ID
      description: |
        Uses the same body and defaults as create. Omitted optional fields are cleared.
        `lecturers` is accepted but ignored: lecturers can only be set when the subject is created.
      operationId: replaceSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
      responses:
        '200':
          description: Subject replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubjectConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Subjects]
      summary: Update selected fields of a subject
      description: |
        Only fields present with a non-null value are changed; `null` cannot clear a field.
        `lecturers` is ignored, and a body with only `lecturers` returns 400 "no fields to update".
      operationId: updateSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectUpdateRequest'
      responses:
        '200':
          description: Subject updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubjectConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Subjects]
      summary: Delete a subject by ID
      operationId: deleteSubject
      security:
        - accessCookie: []
      responses:
        '204':
          description: Subject was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}/tasks:
    get:
      tags: [Subjects]
      summary: Get tasks tied to a subject
      description: Ordered by `created_at`, newest first. Returns an empty array for an unknown subject.
      operationId: getSubjectTasks
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200':
          description: Tasks for the subject.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}/thumbnail:
    post:
      tags: [Subjects]
      summary: Upload a subject thumbnail as raw image bytes
      description: |
        The request body is the raw image (not multipart). PNG, JPEG, and WebP are accepted, up to
        2 MB and 2560x2560 px. The image is converted to WebP, stored under
        `/static/thumbnails/`, and saved as the subject's `thumbnail_url`.
      operationId: uploadSubjectThumbnail
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Thumbnail saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThumbnailUploadResponse'
        '400':
          description: Invalid subject ID, undecodable image, or dimensions above 2560x2560.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ImageTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedImage'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}/file:
    post:
      tags: [Subjects]
      summary: Attach a PDF or text file to a subject
      description: |
        Multipart upload with the file in the `file` field. Only PDF and plain-text files up to
        50 MB are stored, under `/static/files/`. The file then appears in the subject's `files`.
      operationId: uploadSubjectFile
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          description: Missing `file` field or invalid subject ID.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: |
            Internal error. The current backend also returns 500 for an unsupported file type,
            a file above 50 MB, or a subject that does not exist.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks of the authenticated user
      description: Ordered by `created_at`, newest first.
      operationId: getUserTasks
      security:
        - accessCookie: []
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        The subject must belong to the current user. The backend does not apply defaults:
        `type`, `status`, `difficulty`, and `priority` must be sent with valid values, otherwise
        the database rejects the row and the API returns 500.
      operationId: addTask
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasks]
      summary: Delete all tasks of the authenticated user
      operationId: deleteUserTasks
      security:
        - accessCookie: []
      responses:
        '204':
          description: All tasks were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Tasks]
      summary: Get a task by ID
      operationId: getTask
      security:
        - accessCookie: []
      responses:
        '200':
          description: Task found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Tasks]
      summary: Replace a task by ID
      description: Uses the same body as create. Returns 404 when the task or the target subject does not belong to the user.
      operationId: replaceTask
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '200':
          description: Task replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Tasks]
      summary: Update selected task fields
      description: |
        Only fields present with a non-null value are changed. Values are not validated by the
        handler; an invalid enum value returns 500.
      operationId: updateTask
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasks]
      summary: Delete a task by ID
      operationId: deleteTask
      security:
        - accessCookie: []
      responses:
        '204':
          description: Task was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me:
    get:
      tags: [Profile]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/email:
    patch:
      tags: [Profile]
      summary: Update the authenticated user's email
      description: |
        Sets `is_email_verified` to false and sends a new confirmation email. The new email must
        be a valid address and differ from the current one. An email that is already taken returns 409 Conflict.
        The response has `is_totp_enabled: false` and `avatar_url: null` regardless of the
        stored values; call GET /api/users/me for the full profile.
      operationId: updateUserEmail
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Email updated and a confirmation email was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/password:
    patch:
      tags: [Profile]
      summary: Update the authenticated user's password
      description: |
        The new password must be 8-72 characters and differ from the current one.
        A wrong current password returns 403 Forbidden.
      operationId: updateUserPassword
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '204':
          description: Password updated successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/avatar:
    post:
      tags: [Profile]
      summary: Upload the current user's avatar as raw image bytes
      description: |
        The request body is the raw image (not multipart). PNG, JPEG, and WebP are accepted, up to
        2 MB and 2560x2560 px. The image is converted to WebP and stored under `/static/users/`.
      operationId: uploadUserAvatar
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Avatar saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResponse'
        '400':
          description: Undecodable image or dimensions above 2560x2560.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ImageTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedImage'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Profile]
      summary: Remove the current user's avatar
      description: Sets `avatar_url` to null. The stored image file is not deleted.
      operationId: deleteUserAvatar
      security:
        - accessCookie: []
      responses:
        '204':
          description: Avatar removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /static/{path}:
    get:
      tags: [Static]
      summary: Download an uploaded file
      description: |
        Serves files from the backend `data/` directory, for example
        `/static/users/{file}.webp`, `/static/thumbnails/{file}.webp`, and `/static/files/{file}.pdf`.
        Requires authentication but does not check ownership: any logged-in user can read any file
        whose URL they know.
      operationId: getStaticFile
      security:
        - accessCookie: []
      parameters:
        - name: path
          in: path
          required: true
          description: Path relative to `/static/`, for example `users/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp`.
          schema:
            type: string
      responses:
        '200':
          description: File contents.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /metrics:
    get:
      tags: [Monitoring]
      summary: Prometheus metrics
      description: Prometheus text exposition format. Not authenticated.
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Metrics.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly JWT access token cookie.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly JWT refresh token cookie.

  parameters:
    NumericId:
      name: id
      in: path
      required: true
      description: Positive database identifier.
      schema:
        type: integer
        format: int64
        minimum: 1

  headers:
    AuthCookies:
      description: Session cookies are set by the backend.
      schema:
        type: string

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'

  responses:
    BadRequest:
      description: Invalid JSON, missing fields, or invalid payload values.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication cookies.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Action forbidden (e.g. invalid current password).
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A user with this email already exists.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type must be application/json for JSON endpoints.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The submitted token is invalid or expired.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    SubjectConflict:
      description: The user already has a subject with this name.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    ImageTooLarge:
      description: Image is larger than 2 MB.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedImage:
      description: Image format is not PNG, JPEG, or WebP.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LecturerPosition:
      type: string
      description: Required by the backend on create; an empty or unknown value returns 500.
      enum: [lecturer, practical_instructor, lab_instructor, assistant]

    SubjectType:
      type: string
      enum: [university, personal]

    SubjectScope:
      type: string
      enum: [technology, healthcare, humanities, business, social, science, other]

    ExamType:
      type: string
      enum: [exam, credit, coursework, project, other]

    TaskType:
      type: string
      enum: [exam, credit, coursework, project, other]

    TaskStatus:
      type: string
      enum: [not_completed, ongoing, completed]

    TaskDifficulty:
      type: string
      enum: [low, medium, high]

    TaskPriority:
      type: string
      enum: [low, medium, high]

    Error:
      type: string
      description: Plain-text error message.
      example: invalid email or password

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Must be a plain address such as `student@example.com` (no display name).
          example: student@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 8-72 characters on register. Login only checks that it is non-empty and at most 72 characters.
          writeOnly: true
          example: strongPassword123

    User:
      type: object
      required: [id, email, is_email_verified, is_totp_enabled, avatar_url]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: student@example.com
        is_email_verified:
          type: boolean
          example: true
        is_totp_enabled:
          type: boolean
          example: false
        avatar_url:
          type: string
          nullable: true
          example: /static/users/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp

    ChallengeTokenResponse:
      type: object
      required: [challenge_token]
      properties:
        challenge_token:
          type: string
          description: One-time login challenge token for /api/auth/login/totp, valid for 2 minutes.
          example: Xk3pN8vQ2mR7tY1wZ5cB9dF4gH6jL0sA2eU8iO3qT7y

    LoginTOTPRequest:
      type: object
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
          example: Xk3pN8vQ2mR7tY1wZ5cB9dF4gH6jL0sA2eU8iO3qT7y
        code:
          type: string
          description: 6-digit TOTP code.
          example: '123456'

    Passcode:
      type: object
      required: [passcode]
      properties:
        passcode:
          type: string
          description: 6-digit TOTP validation code.
          example: '123456'

    TOTPSetupResponse:
      type: object
      required: [qr_code, text_key]
      properties:
        qr_code:
          type: string
          description: Base64-encoded PNG of the QR code (without a `data:` prefix).
          example: iVBORw0KGgoAAAANSUhEUgAA...
        text_key:
          type: string
          description: TOTP secret to enter manually in the authenticator app.
          example: JBSWY3DPEHPK3PXP

    RecoveryCodesResponse:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$'
          example:
            - ABCD-EFGH-JK23
            - MNPQ-RSTU-VW45
            - XYZ2-3456-789A
            - BCDE-FGHJ-KLMN
            - PQRS-TUVW-XYZ2
            - 3456-789A-BCDE
            - FGHJ-KLMN-PQRS
            - TUVW-XYZ2-3456
            - 789A-BCDE-FGHJ
            - KLMN-PQRS-TUVW

    EmailRequest:
      type: object
      required: [new_email]
      properties:
        new_email:
          type: string
          format: email
          example: new_student@example.com

    PasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          example: currentStrongPassword123
        new_password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          example: newStrongPassword123

    PasswordResetEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: student@example.com

    PasswordResetTokenRequest:
      type: object
      required: [password_reset_token]
      properties:
        password_reset_token:
          type: string
          example: q8Zr3k1V0p9xWm2Lc7NfYt4Hb6Ds5Ja0Ue8Gi1Ko3Rw

    PasswordResetRequest:
      type: object
      required: [password_reset_token, new_password, new_password_confirmed]
      properties:
        password_reset_token:
          type: string
          example: q8Zr3k1V0p9xWm2Lc7NfYt4Hb6Ds5Ja0Ue8Gi1Ko3Rw
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          example: StrongResetPassword123
        new_password_confirmed:
          type: string
          format: password
          writeOnly: true
          example: StrongResetPassword123

    Lecturer:
      type: object
      required: [name, position]
      properties:
        name:
          type: string
          example: Dr. Smith
        position:
          $ref: '#/components/schemas/LecturerPosition'

    Subject:
      type: object
      required: [id, user_id, name, note, type, scope, exam_type, exam_date, course, term, lecturers, thumbnail_url, files]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Databases
        note:
          type: string
          nullable: true
          maxLength: 200
          example: Intro to SQL and relation modeling
        type:
          $ref: '#/components/schemas/SubjectType'
        scope:
          $ref: '#/components/schemas/SubjectScope'
        exam_type:
          $ref: '#/components/schemas/ExamType'
        exam_date:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-20T09:00:00Z'
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          example: 2
        term:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
        thumbnail_url:
          type: string
          nullable: true
          example: /static/thumbnails/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp
        lecturers:
          type: array
          nullable: true
          description: '`null` when the subject has no lecturers.'
          items:
            $ref: '#/components/schemas/Lecturer'
        files:
          type: array
          nullable: true
          description: '`null` when there are no files, and always `null` in list and create responses.'
          items:
            $ref: '#/components/schemas/SubjectFile'

    SubjectFile:
      type: object
      required: [name, url, size_bytes, content_type]
      properties:
        name:
          type: string
          description: Original file name.
          example: lecture-1.pdf
        url:
          type: string
          example: /static/files/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.pdf
        size_bytes:
          type: string
          description: File size in bytes, encoded as a string.
          example: '182734'
        content_type:
          type: string
          example: application/pdf

    SubjectCreateRequest:
      type: object
      required: [name]
      description: Empty `type`, `scope`, and `exam_type` default to `university`, `other`, and `exam`.
      properties:
        name:
          type: string
          minLength: 1
          example: Databases
        note:
          type: string
          nullable: true
          maxLength: 200
          example: Intro to SQL and relation modeling
        type:
          $ref: '#/components/schemas/SubjectType'
        scope:
          $ref: '#/components/schemas/SubjectScope'
        exam_type:
          $ref: '#/components/schemas/ExamType'
        exam_date:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-20T09:00:00Z'
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          example: 2
        term:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
        thumbnail_url:
          type: string
          nullable: true
          example: /static/thumbnails/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp
        lecturers:
          type: array
          description: Only used on create. Ignored by PUT.
          items:
            $ref: '#/components/schemas/Lecturer'

    SubjectUpdateRequest:
      type: object
      minProperties: 1
      description: Send only the fields to change. `null` values are ignored.
      properties:
        name:
          type: string
          minLength: 1
          example: Advanced Databases
        note:
          type: string
          nullable: true
          maxLength: 200
          example: Intro to SQL and relation modeling
        type:
          $ref: '#/components/schemas/SubjectType'
        scope:
          $ref: '#/components/schemas/SubjectScope'
        exam_type:
          $ref: '#/components/schemas/ExamType'
        exam_date:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-20T09:00:00Z'
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          example: 2
        term:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
        thumbnail_url:
          type: string
          nullable: true
          example: /static/thumbnails/1d9c94a6-8f8a-45ad-a0ec-692123f8c7dd.webp

    Task:
      type: object
      required: [id, subject_id, name, type, description, estimated_time, scheduled_at, deadline, status, difficulty, priority, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 10
        subject_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Read chapter 4
        type:
          $ref: '#/components/schemas/TaskType'
        description:
          type: string
          example: Write a short summary and review the key terms.
        estimated_time:
          type: integer
          nullable: true
          minimum: 1
          example: 90
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-08T12:00:00Z'
        deadline:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-10T12:00:00Z'
        status:
          $ref: '#/components/schemas/TaskStatus'
        difficulty:
          $ref: '#/components/schemas/TaskDifficulty'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        created_at:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-02T09:00:00Z'

    TaskCreateRequest:
      type: object
      required: [subject_id, name, type, status, difficulty, priority]
      properties:
        subject_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          example: Read chapter 4
        type:
          $ref: '#/components/schemas/TaskType'
        description:
          type: string
          example: Write a short summary and review the key terms.
        estimated_time:
          type: integer
          nullable: true
          minimum: 1
          example: 90
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-08T12:00:00Z'
        deadline:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-10T12:00:00Z'
        status:
          $ref: '#/components/schemas/TaskStatus'
        difficulty:
          $ref: '#/components/schemas/TaskDifficulty'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    TaskUpdateRequest:
      type: object
      minProperties: 1
      description: Send only the fields to change. `null` values are ignored.
      properties:
        name:
          type: string
          example: Read chapters 4 and 5
        type:
          $ref: '#/components/schemas/TaskType'
        description:
          type: string
          example: Review the primary definitions and examples.
        estimated_time:
          type: integer
          nullable: true
          minimum: 1
          example: 120
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-08T12:00:00Z'
        deadline:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-11T12:00:00Z'
        subject_id:
          type: integer
          format: int64
          minimum: 1
          example: 2
        status:
          $ref: '#/components/schemas/TaskStatus'
        difficulty:
          $ref: '#/components/schemas/TaskDifficulty'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    DashboardStatus:
      type: object
      required:
        - total_subjects
        - total_tasks
        - total_completed_tasks
        - total_ongoing_tasks
        - total_not_completed_tasks
        - completion_percent
        - nearest_deadline_task
        - overdue_tasks
      properties:
        total_subjects:
          type: integer
          format: int64
          example: 2
        total_tasks:
          type: integer
          format: int64
          example: 8
        total_completed_tasks:
          type: integer
          format: int64
          example: 3
        total_ongoing_tasks:
          type: integer
          format: int64
          example: 2
        total_not_completed_tasks:
          type: integer
          format: int64
          example: 3
        completion_percent:
          type: number
          format: double
          example: 37.5
        nearest_deadline_task:
          description: Unfinished task with the closest future deadline, or `null`.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DashboardTask'
        overdue_tasks:
          type: array
          description: Unfinished tasks whose deadline has passed, latest deadline first.
          items:
            $ref: '#/components/schemas/DashboardTask'

    DashboardTask:
      type: object
      description: |
        Task with only id, name, description, deadline, status, and subject_id filled. The other
        Task fields are present with zero values (empty strings, null, `0001-01-01T00:00:00Z`).
      allOf:
        - $ref: '#/components/schemas/Task'

    AvatarUploadResponse:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: string
          example: /static/users/26c15f91-1756-4be7-b4b5-4ea6732dbe11.webp

    ThumbnailUploadResponse:
      type: object
      required: [thumbnail_url]
      properties:
        thumbnail_url:
          type: string
          example: /static/thumbnails/26c15f91-1756-4be7-b4b5-4ea6732dbe11.webp

    FileUploadResponse:
      type: object
      required: [file_url]
      properties:
        file_url:
          type: string
          example: /static/files/26c15f91-1756-4be7-b4b5-4ea6732dbe11.pdf

    ConfirmEmailRequest:
      type: object
      required: [ confirm_email_token ]
      properties:
        confirm_email_token:
          type: string
          description: Token from the confirmation link sent by email.
          example: Xk3pN8vQ2mR7tY1wZ5cB9dF4gH6jL0sA2eU8iO3qT7y