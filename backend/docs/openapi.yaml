openapi: 3.0.3
info:
  title: Studify API
  version: 1.0.0
  description: |
    REST API for users, subjects, study tasks, dashboard statistics, and auth flows.

    Authentication uses HttpOnly cookies (`Path=/`, `SameSite=Lax`, `Secure` when `ENV` is
    `prod` or `production`):
    - access_token: JWT, valid for 15 minutes
    - refresh_token: JWT, valid for 30 days

    Protected endpoints require a valid access_token cookie. Refresh token rotation is done
    through the /api/auth/refresh endpoint.

    Endpoints with a JSON body require `Content-Type: application/json`, otherwise they return
    415. Application errors are JSON objects with a stable code and a message.
    Unknown JSON fields in request objects are rejected with 400.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Registration, login, logout, and token issuance
  - name: Auth / Confirm
    description: Email confirmation flows
  - name: Auth / TOTP
    description: MFA setup and verification
  - name: Auth / Reset Password
    description: Password reset requests, validation, and completion
  - name: Auth / Sessions
    description: Active user session management
  - name: Dashboard
    description: Dashboard overview and task statistics
  - name: Reminders
    description: Email reminders for study deadlines
  - name: Calendar
    description: Study events for a visible date range
  - name: Subjects
    description: Subject and lecturer management
  - name: Tasks
    description: Study task management
  - name: Shared Projects
    description: Shared project management
  - name: Profile
    description: Current authenticated user account operations
  - name: Static
    description: Uploaded files served by the backend
  - name: Monitoring
    description: Prometheus metrics

paths:
  /api/auth/session:
    get:
      tags: [Auth]
      summary: Check the browser session
      description: Returns the current user, refreshing the cookies when needed, or an anonymous session.
      operationId: checkAuthSession
      security: []
      responses:
        '200':
          description: Current session or anonymous visitor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: A concurrent request has already rotated the refresh cookie. Retry with browser cookies.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: >-
        Creates the user, issues auth cookies, and queues a confirmation link for delivery.
        New email addresses are stored in lowercase. An existing address is rejected
        regardless of case. SMTP delivery runs after the request and does not prevent
        session cookies from being set.
      operationId: registerUser
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          description: User was created and auth cookies were issued.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in a user
      operationId: loginUser
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: |
            Credentials are valid. If TOTP is disabled, the server issues auth cookies and
            returns the user. If TOTP is enabled, no cookies are set and the server returns a
            challenge token (valid for 2 minutes) for /api/auth/login/totp.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/ChallengeTokenResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login/totp:
    post:
      tags: [Auth / TOTP]
      summary: Complete MFA login with an authenticator or recovery code
      operationId: loginTOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTOTPRequest'
      responses:
        '200':
          description: The challenge and code were accepted. If a recovery code was used, it was consumed.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out the current user
      description: Uses the refresh cookie to revoke the current session, including its access and refresh tokens.
      operationId: logoutUser
      security:
        - {}
        - refreshCookie: []
      responses:
        '204':
          description: The current session was revoked if present and auth cookies were cleared.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out from all sessions
      description: Revokes every session and its tokens for the authenticated user and clears auth cookies.
      operationId: logoutAllSessions
      security:
        - accessCookie: []
      responses:
        '204':
          description: All active sessions were revoked and auth cookies were cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue new auth cookies
      description: The new cookies belong to the same session.
      operationId: refreshTokens
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Tokens were rotated successfully and the new auth cookies were set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/confirm/resend:
    post:
      tags: [Auth / Confirm]
      summary: Resend the email confirmation message
      operationId: resendConfirmationEmail
      security:
        - accessCookie: []
      responses:
        '204':
          description: Confirmation email was sent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/EmailAlreadyVerified'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/confirm/:
    post:
      tags: [Auth / Confirm]
      summary: Confirm a user's email address
      description: |
        Takes the confirmation token from the email link (valid for 4 hours) in the JSON body.
        The user to verify is taken from the token record, not from the access cookie, so the
        cookie only has to be valid. The token is deleted after a successful confirmation.
      operationId: confirmEmail
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        '204':
          description: Email was confirmed successfully.
        '400':
          description: Invalid JSON, or the confirmation token is invalid, expired or empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp/setup:
    post:
      tags: [Auth / TOTP]
      summary: Generate a TOTP setup QR-code and secret
      description: |
        Generates a new secret and stores it encrypted. TOTP is not enabled until the setup is
        confirmed with /api/auth/totp/setup/confirm. Setup can replace a pending secret.
        If TOTP is already enabled, the stored secret is kept and the request returns 409.
      operationId: generateTOTP
      security:
        - accessCookie: []
      responses:
        '200':
          description: TOTP secret and QR-code were generated and saved for the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp/setup/confirm:
    post:
      tags: [Auth / TOTP]
      summary: Confirm the TOTP setup with a one-time 6-digit code
      operationId: confirmTOTPSetup
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Passcode'
      responses:
        '200':
          description: |
            TOTP was enabled and 10 recovery codes were returned. The codes are shown only once.
            Each code can complete one sign-in at /api/auth/login/totp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp/recovery-codes:
    post:
      tags: [Auth / TOTP]
      summary: Replace recovery codes using a current authenticator code
      description: Replaces all previously issued codes in one transaction. Save the new set when it is displayed.
      operationId: regenerateRecoveryCodes
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Passcode'
      responses:
        '200':
          description: Ten new one-time recovery codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/totp:
    delete:
      tags: [Auth / TOTP]
      summary: Disable TOTP for the authenticated user
      description: Requires the current account password. Recovery codes and unfinished MFA sign-ins are revoked.
      operationId: disableTOTP
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '204':
          description: TOTP was disabled. Recovery codes and pending login challenges were invalidated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password/request:
    post:
      tags: [Auth / Reset Password]
      summary: Request a password reset email
      description: |
        Sends a link `{APP_URL}/reset-password?token={token}`. The token is valid for 30 minutes.
        If the email is not found, the endpoint returns 204 No Content to avoid user enumeration.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetEmailRequest'
      responses:
        '204':
          description: Password reset email was queued. Unknown addresses receive the same response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password/verify:
    post:
      tags: [Auth / Reset Password]
      summary: Validate a password reset token
      operationId: verifyResetPasswordToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenRequest'
      responses:
        '200':
          description: Token is valid. The body is empty.
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/reset-password/:
    post:
      tags: [Auth / Reset Password]
      summary: Reset the user's password with a valid reset token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password was updated, the reset token was consumed, and all sessions were revoked.
        '400':
          description: Missing token, passwords do not match, or invalid new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/sessions:
    get:
      tags: [Auth / Sessions]
      summary: List all active sessions of the authenticated user
      description: Returns all active sessions for the current user, ordered by last login descending.
      operationId: getUserSessions
      security:
        - accessCookie: []
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Auth / Sessions]
      summary: Revoke all active sessions of the authenticated user
      description: Revokes all sessions and their access and refresh tokens for the current user.
      operationId: revokeAllUserSessions
      security:
        - accessCookie: []
      responses:
        '204':
          description: All active sessions were revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Auth / Sessions]
      summary: Get a session by ID
      description: Retrieves a single session by its ID for the authenticated user.
      operationId: getSession
      security:
        - accessCookie: []
      responses:
        '200':
          description: Session found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Auth / Sessions]
      summary: Revoke a session by ID
      description: Revokes a single session and immediately invalidates its access and refresh tokens.
      operationId: revokeSession
      security:
        - accessCookie: []
      responses:
        '204':
          description: Session was revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics for the authenticated user
      operationId: getDashboardStatus
      security:
        - accessCookie: []
      parameters:
        - in: query
          name: time_zone
          description: IANA time zone used to classify date-only deadlines.
          schema:
            type: string
            default: UTC
          example: Europe/Moscow
        - in: query
          name: overdue_offset
          description: Number of overdue tasks to skip. Each page contains at most 10 items.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Dashboard statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/dashboard/plan:
    get:
      tags: [Dashboard]
      summary: Get the study plan with a page of overdue tasks
      operationId: getStudyPlan
      security:
        - accessCookie: []
      parameters:
        - in: query
          name: time_zone
          description: IANA time zone used to classify date-only deadlines.
          schema:
            type: string
            default: UTC
          example: Europe/Moscow
        - in: query
          name: overdue_offset
          description: Number of overdue tasks to skip. Each page contains at most 10 items.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Open tasks, one page of overdue tasks, and aggregate counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/reminders/{target}/{id}:
    parameters:
      - name: target
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ReminderTarget'
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Reminders]
      operationId: getReminder
      summary: Read reminder settings for a task or subject
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current settings and availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Reminders]
      operationId: putReminder
      summary: Set the email reminder for a task deadline or subject event
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderTiming'
      responses:
        '200':
          description: Updated reminder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Reminders]
      operationId: deleteReminder
      summary: Turn off the email reminder
      security:
        - accessCookie: []
      responses:
        '204':
          description: Reminder disabled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/calendar:
    get:
      tags: [Calendar]
      summary: Get study events for a visible period
      operationId: getCalendar
      security:
        - accessCookie: []
      parameters:
        - in: query
          name: start_date
          required: true
          schema: { type: string, format: date }
          description: First visible calendar day, inclusive.
        - in: query
          name: end_date
          required: true
          schema: { type: string, format: date }
          description: Exclusive end of the range, at most 62 days after the start.
        - in: query
          name: time_zone
          schema: { type: string, default: UTC }
          description: IANA time zone used for timed events.
      responses:
        '200':
          description: Open tasks and exams overlapping the selected days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects:
    get:
      tags: [Subjects]
      summary: Get all subjects of the authenticated user
      description: Ordered by ID. In the list response `files` is always `null`; get one subject to see its files.
      operationId: getUserSubjects
      security:
        - accessCookie: []
      responses:
        '200':
          description: Subject list (empty array when the user has none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Subjects]
      summary: Create a subject
      description: Creates one subject together with its lecturers. Subject names are unique per user.
      operationId: addSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
      responses:
        '201':
          description: Subject created. `files` is `null` in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/SubjectConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Subjects]
      summary: Delete all subjects of the authenticated user
      operationId: deleteUserSubjects
      security:
        - accessCookie: []
      responses:
        '204':
          description: All subjects were deleted, together with their tasks, lecturers, and file records.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Subjects]
      summary: Get a subject by ID
      operationId: getSubject
      security:
        - accessCookie: []
      responses:
        '200':
          description: Subject found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Subjects]
      summary: Replace a subject by ID
      description: |
        Uses the same body and defaults as create. Omitted optional fields are cleared.
        `lecturers` is accepted but ignored: lecturers can only be set when the subject is created.
      operationId: replaceSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreateRequest'
      responses:
        '200':
          description: Subject replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubjectConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Subjects]
      summary: Update selected fields of a subject
      description: |
        Only fields present with a non-null value are changed, except `exam_date`, which can be cleared with `null`.
        `lecturers` is ignored, and a body with only `lecturers` returns 400 "no fields to update".
      operationId: updateSubject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectUpdateRequest'
      responses:
        '200':
          description: Subject updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SubjectConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Subjects]
      summary: Delete a subject by ID
      operationId: deleteSubject
      security:
        - accessCookie: []
      responses:
        '204':
          description: Subject was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}/tasks:
    get:
      tags: [Subjects]
      summary: Get tasks tied to a subject
      description: Ordered by `created_at`, newest first. Returns an empty array for an unknown subject.
      operationId: getSubjectTasks
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200':
          description: Tasks for the subject.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}/thumbnail:
    post:
      tags: [Subjects]
      summary: Upload a subject thumbnail as raw image bytes
      description: |
        The request body is the raw image (not multipart). PNG, JPEG, and WebP are accepted, up to
        2 MB and 2560x2560 px. The image is converted to WebP, stored under
        `/static/thumbnails/`, and saved as the subject's `thumbnail_url`.
      operationId: uploadSubjectThumbnail
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Thumbnail saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThumbnailUploadResponse'
        '400':
          description: Invalid subject ID, undecodable image, or dimensions above 2560x2560.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ImageTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedImage'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subjects/{id}/file:
    post:
      tags: [Subjects]
      summary: Attach a PDF or text file to a subject
      description: |
        Multipart upload with the file in the `file` field. Only PDF and plain-text files up to
        50 MiB are stored, under `/static/files/`. The multipart body is limited to 51 MiB.
        The file then appears in the subject's `files`. Each account can store up to 100
        attachments totaling at most 500 MiB.
      operationId: uploadSubjectFile
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          description: Invalid multipart data, missing or empty `file`, or invalid subject ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Account attachment quota reached (`attachment_quota_exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File exceeds 50 MiB or multipart body exceeds the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks of the authenticated user
      description: Ordered by `created_at`, newest first.
      operationId: getUserTasks
      security:
        - accessCookie: []
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        The subject must belong to the current user. The backend does not apply defaults:
        `type`, `status`, `difficulty`, and `priority` must be sent with valid values.
        Invalid fields return 400.
      operationId: addTask
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasks]
      summary: Delete all tasks of the authenticated user
      operationId: deleteUserTasks
      security:
