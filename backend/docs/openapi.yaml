        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Shared Projects]
      summary: Update a shared project
      description: |
        Updates an existing shared project owned by the authenticated user.
        `name`, `url`, and `author` are required. `url` must start with http or https, and must be unique.
      operationId: updateSharedProject
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedProjectRequest'
      responses:
        '200':
          description: Shared project updated.
          content:
