name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the checkout and its Git history
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          scan() {
            docker run --rm --network none \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              "$GITLEAKS_IMAGE" "$@" \
              --config=/repo/.gitleaks.toml --gitleaks-ignore-path=/repo/.gitleaksignore \
              --redact=100 --verbose --no-banner
          }
          scan dir /repo
          scan git /repo --log-opts='--full-history --diff-merges=first-parent HEAD'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libwebp-dev
      - run: go test ./...
      - run: go vet ./...
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studify
          POSTGRES_USER: studify
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studify -d studify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.28.0@sha256:c076638db1e15662150be4fb62b8a6e96ef6ba5bde90c838a0239225854830f7
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply PostgreSQL migrations
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in backend/migrations/*.up.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U studify -d studify -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Start the production backend image
        run: |
          docker build -f backend/Dockerfile -t studify-api:e2e backend
          docker run -d --rm --network host --name studify-e2e-api \
            -e ENV=dev -e SERVER_ADDR=127.0.0.1:8080 \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e TOTP_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e ISSUER=studify-e2e -e APP_NAME=Studify \
            -e APP_URL=http://localhost:5173 \
            -e CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            -e SMTP_HOST=127.0.0.1 -e SMTP_PORT=1025 \
            -e "DATABASE_URL=postgres://studify:fixture-only@127.0.0.1:5432/studify?sslmode=disable" \
            studify-api:e2e
          curl --fail --silent --show-error --retry 15 --retry-connrefused http://127.0.0.1:8080/api/auth/session
      - name: Install Chromium and run browser tests
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run test:e2e
      - name: Read backend logs on failure
        if: failure()
        run: docker logs studify-e2e-api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
